<ion-content>
  <ion-grid>
    <!-- Fila de Cabeceras -->
    <ion-row class="header">
      <ion-col>ID</ion-col>
      <ion-col>Nombre</ion-col>
      <ion-col>Unidades</ion-col>
      <ion-col>Precio</ion-col>
      <ion-col>Vendedor</ion-col>
      <ion-col>Foto</ion-col>
    </ion-row>

    <!-- Fila de Datos (bucle para cada producto) -->
    <ion-row *ngFor="let product of products">
      <ion-col>{{product.id}}</ion-col>
      <ion-col>{{product.nombre}}</ion-col>
      <ion-col>{{product.unidades}}</ion-col>
      <ion-col>{{product.precio}} €</ion-col>
      <ion-col>{{product.vendedor}}</ion-col>
      <ion-col>
        <img [src]="product.foto" width="80" alt="Foto del producto">
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
